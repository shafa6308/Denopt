<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaStore — Опт та Роздріб (Одеса)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .category-card:hover { transform: translateY(-3px); }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

    <!-- Хедер -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Логотип (3 клика = Админка) -->
            <div id="logo" class="text-2xl font-bold cursor-pointer select-none flex items-center space-x-2">
                <i class="fas fa-store"></i>
                <span>MegaStore <span class="text-xs bg-indigo-500 px-2 py-0.5 rounded">Одеса (Опт/Роздріб)</span></span>
            </div>

            <!-- Поиск -->
            <div class="flex-1 max-w-md mx-4 hidden md:block">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Пошук товарів..." 
                        class="w-full pl-10 pr-4 py-2 rounded-full text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-300">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                </div>
            </div>

            <!-- Корзина -->
            <button id="cartBtn" class="relative bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-full transition flex items-center space-x-2">
                <i class="fas fa-shopping-cart"></i>
                <span class="font-semibold">Кошик</span>
                <span id="cartCount" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Главный контент -->
    <main class="container mx-auto px-4 py-6 flex-1">
        
        <!-- Категории -->
        <section class="mb-8">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Категорії</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                <button onclick="filterCategory('all')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-indigo-500 hover:border-indigo-600 transition">
                    <i class="fas fa-th text-2xl text-indigo-500 mb-2"></i>
                    <div class="font-semibold text-sm">Всі товари</div>
                </button>
                <button onclick="filterCategory('women')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-transparent hover:border-indigo-500 transition">
                    <i class="fas fa-female text-2xl text-pink-500 mb-2"></i>
                    <div class="font-semibold text-sm">Жіночий одяг</div>
                </button>
                <button onclick="filterCategory('men')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-transparent hover:border-indigo-500 transition">
                    <i class="fas fa-male text-2xl text-blue-500 mb-2"></i>
                    <div class="font-semibold text-sm">Чоловічий одяг</div>
                </button>
                <button onclick="filterCategory('shoes')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-transparent hover:border-indigo-500 transition">
                    <i class="fas fa-shoe-prints text-2xl text-amber-500 mb-2"></i>
                    <div class="font-semibold text-sm">Взуття</div>
                </button>
                <button onclick="filterCategory('tech')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-transparent hover:border-indigo-500 transition">
                    <i class="fas fa-plug text-2xl text-emerald-500 mb-2"></i>
                    <div class="font-semibold text-sm">Міні-техніка</div>
                </button>
            </div>
        </section>

        <!-- Сетка товаров -->
        <section>
            <h2 class="text-xl font-bold mb-4 text-gray-700" id="sectionTitle">Каталог товарів</h2>
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Товары рендерятся через JS -->
            </div>
        </section>
    </main>

    <!-- Модальное окно полной информации о товаре -->
    <div id="productModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-3xl">&times;</button>
            <div id="productModalContent"></div>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col p-6 shadow-xl overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Ваш кошик</h3>
                <button id="closeCart" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <div id="cartItems" class="flex-1 space-y-4 mb-4"></div>
            
            <div class="border-t pt-4 space-y-3">
                <h4 class="font-bold text-gray-700">Дані для доставки (Одеса / Україна)</h4>
                <input type="text" id="orderName" placeholder="Ваше ім'я та прізвище" class="w-full border rounded-lg p-2 text-sm" required>
                <input type="tel" id="orderPhone" placeholder="Телефон (наприклад, 0931234567)" class="w-full border rounded-lg p-2 text-sm" required>
                <input type="text" id="orderAddress" placeholder="Адреса (місто, відділення Нової Пошти)" class="w-full border rounded-lg p-2 text-sm" required>
            </div>

            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>Разом:</span>
                    <span id="cartTotal">0 грн</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition">
                    Оформити замовлення
                </button>
            </div>
        </div>
    </div>

    <!-- Панель администратора -->
    <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Панель керування (Адмінка)</h3>
                <button id="closeAdmin" class="text-gray-500 text-2xl">&times;</button>
            </div>

            <!-- Вкладки админки -->
            <div class="flex border-b mb-4 justify-between items-center">
                <div class="flex">
                    <button onclick="switchAdminTab('products')" id="tabProductsBtn" class="py-2 px-4 font-bold border-b-2 border-indigo-600 text-indigo-600">Товари</button>
                    <button onclick="switchAdminTab('orders')" id="tabOrdersBtn" class="py-2 px-4 font-bold text-gray-500">Замовлення (<span id="ordersCountBadge">0</span>)</button>
                </div>
                <!-- Кнопка Добавить товар (+) -->
                <button onclick="openProductFormModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center space-x-1 shadow">
                    <i class="fas fa-plus"></i>
                    <span>Додати товар</span>
                </button>
            </div>

            <!-- Секция 1: Список товаров с редактированием -->
            <div id="adminProductsSection" class="space-y-4">
                <h4 class="font-bold text-gray-700">Керування товарами в каталозі</h4>
                <div id="adminProductsList" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
                    <!-- Рендерится через JS -->
                </div>
            </div>

            <!-- Секция 2: Заказы и клиенты -->
            <div id="adminOrdersSection" class="hidden space-y-4">
                <h4 class="font-bold text-gray-700">Список замовлень від покупців</h4>
                <div id="adminOrdersList" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания/редактирования товара с полем ИИ -->
    <div id="productFormModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl max-h-[95vh] overflow-y-auto relative">
            <button onclick="closeProductFormModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-2xl">&times;</button>
            
            <h3 id="productFormTitle" class="text-xl font-bold text-gray-800 mb-4">Додати новий товар</h3>

            <!-- AI Автозаполнение -->
            <div class="bg-indigo-50 border border-indigo-200 p-3 rounded-xl mb-4 space-y-2">
                <label class="block text-xs font-bold text-indigo-900 flex items-center space-x-1">
                    <i class="fas fa-robot text-indigo-600"></i>
                    <span>Автозаповнення за допомогою штучного інтелекту (ШІ)</span>
                </label>
                <textarea id="aiInputText" placeholder="Вставте сюди повний текст опису товару від постачальника (ціни, розміри, назву)..." rows="2" class="w-full border rounded-lg p-2 text-xs bg-white"></textarea>
                <button type="button" onclick="parseWithAI()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-1.5 px-3 rounded-lg transition w-full">
                    ✨ Розібрати текст і заповнити поля автоматично
                </button>
            </div>

            <form id="productEditForm" class="space-y-3" onsubmit="saveProduct(event)">
                <input type="hidden" id="editProdId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Назва товару</label>
                    <input type="text" id="prodTitle" required class="w-full border rounded-lg p-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Категорія</label>
                        <select id="prodCategory" class="w-full border rounded-lg p-2 text-sm">
                            <option value="women">Жіночий одяг</option>
                            <option value="men">Чоловічий одяг</option>
                            <option value="shoes">Взуття</option>
                            <option value="tech">Міні-техніка</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Посилання на фото (URL)</label>
                        <input type="url" id="prodImg" required class="w-full border rounded-lg p-2 text-sm" placeholder="https://...">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Ціна за 1 шт (грн)</label>
                        <input type="number" id="prodPrice" required class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Ціна за ростовку (грн)</label>
                        <input type="number" id="prodBoxPrice" required class="w-full border rounded-lg p-2 text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Штук у ростовці</label>
                        <input type="number" id="prodBoxQty" required class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Розміри (Євро / Укр)</label>
                        <input type="text" id="prodSizes" required class="w-full border rounded-lg p-2 text-sm" placeholder="S(42), M(44)...">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Повний опис товару</label>
                    <textarea id="prodDesc" rows="3" required class="w-full border rounded-lg p-2 text-sm"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold text-sm transition">
                    Зберегти товар
                </button>
            </form>
        </div>
    </div>

    <!-- Скрипт логики -->
    <script>
        const initialProducts = [
            { 
                id: 1, 
                title: 'Куртка демісезонна', 
                category: 'men', 
                price: 4500, 
                boxPrice: 15000, 
                boxQty: 4, 
                sizes: 'M (48), L (50), XL (52), XXL (54)', 
                desc: 'Стильна демісезонна куртка високої якості. Водовідштовхувальна тканина.', 
                img: 'https://images.unsplash.com/photo-1544441893-675973e31985?w=500' 
            },
            { 
                id: 2, 
                title: 'Сукня вечірня', 
                category: 'women', 
                price: 3200, 
                boxPrice: 11000, 
                boxQty: 4, 
                sizes: 'S (42-44), M (44-46), L (46-48)', 
                desc: 'Елегантна вечірня сукня для особливих подій.', 
                img: 'https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=500' 
            }
        ];

        let products = JSON.parse(localStorage.getItem('products')) || initialProducts;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let orders = JSON.parse(localStorage.getItem('orders')) || [];
        let logoClicks = 0;

        // Отрисовка товаров
        function renderProducts(items = products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = items.map(product => `
                <div class="product-card bg-white rounded-2xl shadow-sm hover:shadow-md transition p-4 flex flex-col cursor-pointer" onclick="openProductModal(${product.id})">
                    <img src="${product.img}" alt="${product.title}" class="w-full h-48 object-cover rounded-xl mb-4 pointer-events-none">
                    <h3 class="font-bold text-gray-800 mb-1 flex-1">${product.title}</h3>
                    <div class="text-xs text-gray-500 mb-2">Розміри: ${product.sizes}</div>
                    <div class="flex items-center justify-between mt-auto pt-2 border-t">
                        <div>
                            <div class="text-sm font-bold text-indigo-600">${product.price} грн <span class="text-xs font-normal text-gray-500">/ шт</span></div>
                            <div class="text-xs font-semibold text-emerald-600">${product.boxPrice} грн <span class="text-gray-500 font-normal">/ ростовка (${product.boxQty} шт)</span></div>
                        </div>
                        <span class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white p-2 rounded-xl transition text-xs font-bold">Деталі</span>
                    </div>
                </div>
            `).join('');
        }

        // Детальное окно товара
        function openProductModal(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;

            document.getElementById('productModalContent').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <img src="${p.img}" alt="${p.title}" class="w-full h-72 object-cover rounded-xl shadow">
                    <div class="flex flex-col justify-between">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800 mb-2">${p.title}</h2>
                            <p class="text-sm text-gray-600 mb-4">${p.desc}</p>
                            <div class="bg-gray-50 p-3 rounded-xl border mb-4 space-y-1 text-sm">
                                <div class="font-semibold text-gray-700">Розмірна сітка:</div>
                                <div class="text-indigo-600 font-bold">${p.sizes}</div>
                            </div>
                        </div>
                        <div class="space-y-3 pt-4 border-t">
                            <div class="flex items-center justify-between">
                                <div>
                                    <div class="text-lg font-bold text-indigo-600">${p.price} грн</div>
                                    <div class="text-xs text-gray-500">За 1 штуку (роздріб)</div>
                                </div>
                                <button onclick="addToCartType(${p.id}, 'piece')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">Купити 1 шт</button>
                            </div>
                            <div class="flex items-center justify-between bg-emerald-50 p-3 rounded-xl border border-emerald-200">
                                <div>
                                    <div class="text-lg font-bold text-emerald-700">${p.boxPrice} грн</div>
                                    <div class="text-xs text-emerald-800">За ростовку (${p.boxQty} шт)</div>
                                </div>
                                <button onclick="addToCartType(${p.id}, 'box')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">Купити ростовку</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function filterCategory(cat) {
            if(cat === 'all') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }

        // Корзина
        function addToCartType(id, type) {
            const prod = products.find(p => p.id === id);
            const cartKey = `${id}_${type}`;
            const existing = cart.find(c => c.cartKey === cartKey);

            if (type === 'piece') {
                if (existing) existing.qty++;
                else cart.push({ cartKey, id: prod.id, title: `${prod.title} (Роздріб - 1 шт)`, price: prod.price, qty: 1 });
            } else {
                if (existing) existing.qty++;
                else cart.push({ cartKey, id: prod.id, title: `${prod.title} (Ростовка - ${prod.boxQty} шт)`, price: prod.boxPrice, qty: 1 });
            }

            updateCart();
            closeProductModal();
            alert('Товар додано до кошика!');
        }

        function updateCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
            
            const cartItems = document.getElementById('cartItems');
            if(cart.length === 0) {
                cartItems.innerHTML = '<p class="text-gray-500 text-center py-8">Кошик порожній</p>';
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="flex items-center justify-between border-b pb-2">
                        <div>
                            <div class="font-bold text-sm">${item.title}</div>
                            <div class="text-xs text-gray-500">${item.price} грн x ${item.qty}</div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold">${item.price * item.qty} грн</span>
                            <button onclick="removeFromCart('${item.cartKey}')" class="text-red-500 hover:text-red-700 ml-2">&times;</button>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('cartTotal').textContent = cart.reduce((sum, item) => sum + (item.price * item.qty), 0) + ' грн';
        }

        function removeFromCart(cartKey) {
            cart = cart.filter(c => c.cartKey !== cartKey);
            updateCart();
        }

        function checkout() {
            if(cart.length === 0) return alert('Кошик порожній!');
            const name = document.getElementById('orderName').value.trim();
            const phone = document.getElementById('orderPhone').value.trim();
            const address = document.getElementById('orderAddress').value.trim();

            if(!name || !phone || !address) return alert('Заповніть дані для доставки!');

            orders.unshift({
                id: Date.now(),
                date: new Date().toLocaleString('uk-UA'),
                customer: { name, phone, address },
                items: [...cart],
                total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0)
            });
            localStorage.setItem('orders', JSON.stringify(orders));

            alert('Замовлення успішно оформлено!');
            cart = [];
            updateCart();
            document.getElementById('cartModal').classList.add('hidden');
        }

        // Админка
        document.getElementById('logo').addEventListener('click', () => {
            logoClicks++;
            if(logoClicks === 3) {
                logoClicks = 0;
                if(prompt('Введіть пароль адміністратора:') === '7777') {
                    openAdminPanel();
                } else {
                    alert('Невірний пароль!');
                }
            }
            setTimeout(() => logoClicks = 0, 1500);
        });

        function openAdminPanel() {
            renderAdminProducts();
            renderAdminOrders();
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function switchAdminTab(tab) {
            const prodBtn = document.getElementById('tabProductsBtn');
            const ordBtn = document.getElementById('tabOrdersBtn');
            const prodSec = document.getElementById('adminProductsSection');
            const ordSec = document.getElementById('adminOrdersSection');

            if(tab === 'products') {
                prodBtn.className = 'py-2 px-4 font-bold border-b-2 border-indigo-600 text-indigo-600';
                ordBtn.className = 'py-2 px-4 font-bold text-gray-500';
                prodSec.classList.remove('hidden');
                ordSec.classList.add('hidden');
            } else {
                ordBtn.className = 'py-2 px-4 font-bold border-b-2 border-indigo-600 text-indigo-600';
                prodBtn.className = 'py-2 px-4 font-bold text-gray-500';
                ordSec.classList.remove('hidden');
                prodSec.classList.add('hidden');
            }
        }

        function renderAdminProducts() {
            const list = document.getElementById('adminProductsList');
            list.innerHTML = products.map(p => `
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border text-sm">
                    <div class="flex items-center space-x-3 flex-1 truncate">
                        <img src="${p.img}" class="w-10 h-10 object-cover rounded-lg">
                        <div class="truncate">
                            <div class="font-bold">${p.title}</div>
                            <div class="text-xs text-gray-500">Шт: ${p.price}грн | Ростовка: ${p.boxPrice}грн (${p.boxQty}шт)</div>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="editProduct(${p.id})" class="bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white px-3 py-1 rounded-lg text-xs font-bold transition">Редагувати</button>
                        <button onclick="deleteProduct(${p.id})" class="bg-red-50 text-red-600 hover:bg-red-600 hover:text-white px-3 py-1 rounded-lg text-xs font-bold transition">Видалити</button>
                    </div>
                </div>
            `).join('');
        }

        function renderAdminOrders() {
            document.getElementById('ordersCountBadge').textContent = orders.length;
            const list = document.getElementById('adminOrdersList');
            if(orders.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-4">Ще немає замовлень</p>';
                return;
            }
            list.innerHTML = orders.map(ord => `
                <div class="bg-gray-50 p-4 rounded-xl border space-y-2 text-sm">
                    <div class="flex justify-between font-bold text-indigo-600">
                        <span>Замовлення #${ord.id}</span>
                        <span>${ord.date}</span>
                    </div>
                    <div class="border-t pt-1">
                        <div class="font-semibold">Клієнт: ${ord.customer.name}</div>
                        <div>Тел: ${ord.customer.phone} | Адреса: ${ord.customer.address}</div>
                    </div>
                    <div class="border-t pt-1">
                        ${ord.items.map(i => `<div class="text-xs text-gray-600">- ${i.title} (${i.qty} шт.) — ${i.price * i.qty} грн</div>`).join('')}
                    </div>
                    <div class="border-t pt-1 flex justify-between font-bold text-gray-800">
                        <span>Сума:</span>
                        <span class="text-green-600">${ord.total} грн</span>
                    </div>
                </div>
            `).join('');
        }

        // Модальное окно создания/редактирования
        function openProductFormModal(prodId = null) {
            document.getElementById('aiInputText').value = '';
            if (prodId) {
                const p = products.find(x => x.id === prodId);
                document.getElementById('productFormTitle').textContent = 'Редагувати товар';
                document.getElementById('editProdId').value = p.id;
                document.getElementById('prodTitle').value = p.title;
                document.getElementById('prodCategory').value = p.category;
                document.getElementById('prodImg').value = p.img;
                document.getElementById('prodPrice').value = p.price;
                document.getElementById('prodBoxPrice').value = p.boxPrice;
                document.getElementById('prodBoxQty').value = p.boxQty;
                document.getElementById('prodSizes').value = p.sizes;
                document.getElementById('prodDesc').value = p.desc;
            } else {
                document.getElementById('productFormTitle').textContent = 'Додати новий товар';
                document.getElementById('productEditForm').reset();
                document.getElementById('editProdId').value = '';
            }
            document.getElementById('productFormModal').classList.remove('hidden');
        }

        function closeProductFormModal() {
            document.getElementById('productFormModal').classList.add('hidden');
        }

        function editProduct(id) {
            openProductFormModal(id);
        }

        function deleteProduct(id) {
            if(confirm('Видалити цей товар?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('products', JSON.stringify(products));
                renderProducts();
                renderAdminProducts();
            }
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('editProdId').value;
            const data = {
                id: id ? Number(id) : Date.now(),
                title: document.getElementById('prodTitle').value,
                category: document.getElementById('prodCategory').value,
                img: document.getElementById('prodImg').value,
                price: Number(document.getElementById('prodPrice').value),
                boxPrice: Number(document.getElementById('prodBoxPrice').value),
                boxQty: Number(document.getElementById('prodBoxQty').value),
                sizes: document.getElementById('prodSizes').value,
                desc: document.getElementById('prodDesc').value
            };

            if (id) {
                const index = products.findIndex(p => p.id === Number(id));
                products[index] = data;
            } else {
                products.push(data);
            }

            localStorage.setItem('products', JSON.stringify(products));
            renderProducts();
            renderAdminProducts();
            closeProductFormModal();
            alert('Товар успішно збережено!');
        }

        // Интеллектуальный разбор текста (ИИ-помощник)
        function parseWithAI() {
            const text = document.getElementById('aiInputText').value;
            if(!text.trim()) return alert('Будь ласка, введіть текст для аналізу!');

            // Извлечение чисел для цен и количества
            const numbers = text.match(/\d+/g) || [];
            
            // Первая строка текста или первые 4 слова обычно название
            const lines = text.split('\n').filter(l => l.trim().length > 0);
            const title = lines[0] ? lines[0].substring(0, 45) : 'Товар з оновлення';
            
            // Попытка найти цены (если чисел несколько)
            let price = numbers[0] ? Number(numbers[0]) : 500;
            let boxPrice = numbers[1] ? Number(numbers[1]) : price * 4;
            let boxQty = 4; // стандартное количество в ростовке

            // Поиск размеров в тексте (например S, M, L, XL или цифры 42, 44)
            const sizesMatch = text.match(/([SMLXL0-9\-\s,\(\)]+розмір[а-х]?|[0-9]{2}[\s\-\/][0-9]{2})/gi);
            const sizes = sizesMatch ? sizesMatch[0] : 'S, M, L, XL';

            // Заполняем форму
            document.getElementById('prodTitle').value = title;
            document.getElementById('prodPrice').value = price;
            document.getElementById('prodBoxPrice').value = boxPrice;
            document.getElementById('prodBoxQty').value = boxQty;
            document.getElementById('prodSizes').value = sizes;
            document.getElementById('prodDesc').value = text;

            alert('✨ ШІ успішно проаналізував текст та заповнив поля форми!');
        }

        // Слушатели
        document.getElementById('cartBtn').onclick = () => document.getElementById('cartModal').classList.remove('hidden');
        document.getElementById('closeCart').onclick = () => document.getElementById('cartModal').classList.add('hidden');
        document.getElementById('closeAdmin').onclick = () => document.getElementById('adminModal').classList.add('hidden');

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            renderProducts(products.filter(p => p.title.toLowerCase().includes(val)));
        });

        renderProducts();
        updateCart();
    </script>
</body>
</html>
