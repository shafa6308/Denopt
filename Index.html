<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaStore — Маркетплейс</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .category-card:hover { transform: translateY(-3px); }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

    <!-- Хедер -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Логотип (3 клика = Админка) -->
            <div id="logo" class="text-2xl font-bold cursor-pointer select-none flex items-center space-x-2">
                <i class="fas me-shopping-bag"></i>
                <span>MegaStore</span>
            </div>

            <!-- Поиск -->
            <div class="flex-1 max-w-md mx-4 hidden md:block">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Поиск товаров..." 
                        class="w-full pl-10 pr-4 py-2 rounded-full text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-300">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                </div>
            </div>

            <!-- Корзина -->
            <button id="cartBtn" class="relative bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-full transition flex items-center space-x-2">
                <i class="fas fa-shopping-cart"></i>
                <span class="font-semibold">Корзина</span>
                <span id="cartCount" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Главный контент -->
    <main class="container mx-auto px-4 py-6 flex-1">
        
        <!-- Категории -->
        <section class="mb-8">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Категории</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                <button onclick="filterCategory('all')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-indigo-500 hover:border-indigo-600 transition">
                    <i class="fas fa-th text-2xl text-indigo-500 mb-2"></i>
                    <div class="font-semibold text-sm">Все товары</div>
                </button>
                <button onclick="filterCategory('women')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-transparent hover:border-indigo-500 transition">
                    <i class="fas fa-female text-2xl text-pink-500 mb-2"></i>
                    <div class="font-semibold text-sm">Женская одежда</div>
                </button>
                <button onclick="filterCategory('men')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-transparent hover:border-indigo-500 transition">
                    <i class="fas fa-male text-2xl text-blue-500 mb-2"></i>
                    <div class="font-semibold text-sm">Мужская одежда</div>
                </button>
                <button onclick="filterCategory('shoes')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-transparent hover:border-indigo-500 transition">
                    <i class="fas fa-shoe-prints text-2xl text-amber-500 mb-2"></i>
                    <div class="font-semibold text-sm">Обувь</div>
                </button>
                <button onclick="filterCategory('tech')" class="category-btn bg-white p-4 rounded-xl shadow-sm text-center border-2 border-transparent hover:border-indigo-500 transition">
                    <i class="fas fa-plug text-2xl text-emerald-500 mb-2"></i>
                    <div class="font-semibold text-sm">Мини-техника</div>
                </button>
            </div>
        </section>

        <!-- Сетка товаров -->
        <section>
            <h2 class="text-xl font-bold mb-4 text-gray-700" id="sectionTitle">Каталог товаров</h2>
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Товары рендерятся через JS -->
            </div>
        </section>
    </main>

    <!-- Модальное окно корзины -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col p-6 shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Ваша корзина</h3>
                <button id="closeCart" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <div id="cartItems" class="flex-1 overflow-y-auto space-y-4">
                <!-- Товары в корзине -->
            </div>
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>Итого:</span>
                    <span id="cartTotal">0 ₽</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition">
                    Оформить заказ
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно админки -->
    <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Панель управления</h3>
                <button id="closeAdmin" class="text-gray-500 text-2xl">&times;</button>
            </div>
            <form id="addProductForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Название товара</label>
                    <input type="text" id="prodTitle" required class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Категория</label>
                    <select id="prodCategory" class="w-full border rounded-lg p-2">
                        <option value="women">Женская одежда</option>
                        <option value="men">Мужская одежда</option>
                        <option value="shoes">Обувь</option>
                        <option value="tech">Мини-техника</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Цена (руб)</label>
                    <input type="number" id="prodPrice" required class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Ссылка на фото (URL)</label>
                    <input type="url" id="prodImg" required class="w-full border rounded-lg p-2" placeholder="https://images.unsplash.com/...">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold">Добавить товар</button>
            </form>
        </div>
    </div>

    <!-- Скрипт логики -->
    <script>
        // Базовые товары
        const initialProducts = [
            { id: 1, title: 'Куртка демисезонная', category: 'men', price: 4500, img: 'https://images.unsplash.com/photo-1544441893-675973e31985?w=500' },
            { id: 2, title: 'Платье вечернее', category: 'women', price: 3200, img: 'https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=500' },
            { id: 3, title: 'Кроссовки спортивные', category: 'shoes', price: 5800, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500' },
            { id: 4, title: 'Беспроводной увлажнитель', category: 'tech', price: 1900, img: 'https://images.unsplash.com/photo-1585771724684-38269d6639fd?w=500' }
        ];

        let products = JSON.parse(localStorage.getItem('products')) || initialProducts;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let logoClicks = 0;

        // Отрисовка товаров
        function renderProducts(items = products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = items.map(product => `
                <div class="product-card bg-white rounded-2xl shadow-sm hover:shadow-md transition p-4 flex flex-col">
                    <img src="${product.img}" alt="${product.title}" class="w-full h-48 object-cover rounded-xl mb-4">
                    <h3 class="font-bold text-gray-800 mb-1 flex-1">${product.title}</h3>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-lg font-bold text-indigo-600">${product.price} ₽</span>
                        <button onclick="addToCart(${product.id})" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-xl transition">
                            <i class="fas fa-cart-plus"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Фильтрация
        function filterCategory(cat) {
            if(cat === 'all') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }

        // Корзина
        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const item = cart.find(c => c.id === id);
            if(item) item.qty++;
            else cart.push({...prod, qty: 1});
            updateCart();
        }

        function updateCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
            
            const cartItems = document.getElementById('cartItems');
            cartItems.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between border-b pb-2">
                    <div>
                        <div class="font-bold text-sm">${item.title}</div>
                        <div class="text-xs text-gray-500">${item.price} ₽ x ${item.qty}</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold">${item.price * item.qty} ₽</span>
                        <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 ml-2">&times;</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('cartTotal').textContent = cart.reduce((sum, item) => sum + (item.price * item.qty), 0) + ' ₽';
        }

        function removeFromCart(id) {
            cart = cart.filter(c => c.id !== id);
            updateCart();
        }

        function checkout() {
            if(cart.length === 0) return alert('Корзина пуста!');
            alert('Спасибо за заказ! Наш менеджер свяжется с вами.');
            cart = [];
            updateCart();
            document.getElementById('cartModal').classList.add('hidden');
        }

        // Вход в Админку
        document.getElementById('logo').addEventListener('click', () => {
            logoClicks++;
            if(logoClicks === 3) {
                logoClicks = 0;
                const pass = prompt('Введите пароль администратора:');
                if(pass === '7777') {
                    document.getElementById('adminModal').classList.remove('hidden');
                } else {
                    alert('Неверный пароль!');
                }
            }
            setTimeout(() => logoClicks = 0, 1500);
        });

        // Добавление товара
        document.getElementById('addProductForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newProd = {
                id: Date.now(),
                title: document.getElementById('prodTitle').value,
                category: document.getElementById('prodCategory').value,
                price: Number(document.getElementById('prodPrice').value),
                img: document.getElementById('prodImg').value
            };
            products.push(newProd);
            localStorage.setItem('products', JSON.stringify(products));
            renderProducts();
            document.getElementById('adminModal').classList.add('hidden');
            e.target.reset();
        });

        // Слушатели модалок
        document.getElementById('cartBtn').onclick = () => document.getElementById('cartModal').classList.remove('hidden');
        document.getElementById('closeCart').onclick = () => document.getElementById('cartModal').classList.add('hidden');
        document.getElementById('closeAdmin').onclick = () => document.getElementById('adminModal').classList.add('hidden');

        // Поиск
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            renderProducts(products.filter(p => p.title.toLowerCase().includes(val)));
        });

        // Инициализация
        renderProducts();
        updateCart();
    </script>
</body>
</html>
